AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Employee Document Vault - Phase 1 + Phase 2
  Storage layer (S3, KMS, DynamoDB) plus authentication and access-control
  layer (Cognito User Pool, Employees table, API Gateway with Cognito authorizer).

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment, used in resource naming.

Conditions:
  IsProd: !Equals [!Ref Env, "prod"]

Globals:
  Function:
    Tracing: Active

Resources:

  # ---------------------------------------------------------------------
  # KMS key for S3 default encryption (SSE-KMS)
  # ---------------------------------------------------------------------
  DocVaultKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for docvault-employee-documents-${Env}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  DocVaultKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/docvault-${Env}"
      TargetKeyId: !Ref DocVaultKmsKey

  # ---------------------------------------------------------------------
  # S3 access-log bucket
  # Kept separate from the employee document bucket.
  # ---------------------------------------------------------------------
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "docvault-access-logs-${Env}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Project
          Value: employee-document-vault
        - Key: Environment
          Value: !Ref Env
        - Key: Purpose
          Value: s3-access-logs

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::${AccessLogsBucket}/access-logs/*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${DocumentsBucket}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${AccessLogsBucket}"
              - !Sub "arn:aws:s3:::${AccessLogsBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---------------------------------------------------------------------
  # S3 bucket:
  # /documents/{employee_id}/{document_type}/{filename}
  # ---------------------------------------------------------------------
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "docvault-employee-documents-${Env}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "http://localhost:5173"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DocVaultKmsKey
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionNoncurrentVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
      LoggingConfiguration:
        LogFilePrefix: access-logs/
        DestinationBucketName: !Ref AccessLogsBucket
      Tags:
        - Key: Project
          Value: employee-document-vault
        - Key: Environment
          Value: !Ref Env

  # Enforce HTTPS-only access (aws:SecureTransport)
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${DocumentsBucket}"
              - !Sub "arn:aws:s3:::${DocumentsBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---------------------------------------------------------------------
  # DynamoDB: Documents metadata table
  # ---------------------------------------------------------------------
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Documents-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
        - AttributeName: employee_id
          AttributeType: S
        - AttributeName: upload_timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: employee_id-index
          KeySchema:
            - AttributeName: employee_id
              KeyType: HASH
            - AttributeName: upload_timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # DynamoDB: AuditLog table (append-only at the application layer)
  # ---------------------------------------------------------------------
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "AuditLog-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: log_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: log_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # =====================================================================
  # PHASE 2 — Authentication & Access Control
  # =====================================================================

  # ---------------------------------------------------------------------
  # Cognito User Pool
  # ---------------------------------------------------------------------
  DocVaultUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "docvault-user-pool-${Env}"
      # Allow employees to sign in with their email address
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Password policy: 8+ chars, upper, lower, number, symbol
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      # Account recovery via email only
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Custom attribute: links a Cognito user to an HR employee record
      Schema:
        - Name: employee_id
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '64'
      # Protect the pool from accidental deletion in prod; inactive in dev/staging to allow stack rollbacks
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UserPoolTags:
        Project: employee-document-vault
        Environment: !Ref Env

  # Hosted-UI domain (optional) — used by the Phase 3 frontend for the Cognito
  # hosted sign-in UI.  The prefix "docvault-<env>" is proposed; it must be
  # globally unique across all Cognito user pools at deploy time.  Prefix
  # availability does not need to be verified during local implementation —
  # if the chosen prefix is taken, an alternative can be selected before
  # the first deployment.
  DocVaultUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "docvault-${Env}"
      UserPoolId: !Ref DocVaultUserPool

  # App client used by the SPA / API callers (no client secret)
  DocVaultUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "docvault-client-${Env}"
      UserPoolId: !Ref DocVaultUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # Token validity
      AccessTokenValidity: 60          # minutes
      IdTokenValidity: 60              # minutes
      RefreshTokenValidity: 43200      # minutes (30 days)
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes
      # Prevent user-existence errors leaking information
      PreventUserExistenceErrors: ENABLED
      # Read standard + custom attributes
      ReadAttributes:
        - email
        - custom:employee_id
      WriteAttributes:
        - email
        - custom:employee_id

  # ---------------------------------------------------------------------
  # Cognito User Pool Groups
  # Maps to the three RBAC roles defined in the architecture.
  # ---------------------------------------------------------------------
  EmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      Description: Standard employees — can access their own documents only
      UserPoolId: !Ref DocVaultUserPool
      Precedence: 30

  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Manager
      Description: Managers — can access their own documents and those of direct reports
      UserPoolId: !Ref DocVaultUserPool
      Precedence: 20

  HRAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: HR_Admin
      Description: HR Administrators — full access to all employee documents
      UserPoolId: !Ref DocVaultUserPool
      Precedence: 10

  # ---------------------------------------------------------------------
  # DynamoDB: Employees table
  # Stores employee identity and manager/direct-report relationships.
  # Primary key: employee_id (matches custom:employee_id in Cognito)
  # GSI: manager_id-index — used by checkAccess to list direct reports
  # ---------------------------------------------------------------------
  EmployeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Employees-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employee_id
          AttributeType: S
        - AttributeName: manager_id
          AttributeType: S
      KeySchema:
        - AttributeName: employee_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: manager_id-index
          KeySchema:
            - AttributeName: manager_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: employee-document-vault
        - Key: Environment
          Value: !Ref Env

  # ---------------------------------------------------------------------
  # API Gateway REST API
  #
  # WHY THIS RESOURCE EXISTS NOW (pre-Phase 3):
  # AWS SAM requires a named AWS::Serverless::Api resource to exist in the
  # template so that a Cognito authorizer can be declared as the *default*
  # authorizer for all routes.  Declaring it here (without any routes)
  # means Phase 3 Lambda functions only need to reference this API by its
  # logical ID — they do not each have to repeat authorizer configuration.
  # The stage is fixed at "v1" regardless of environment.
  # ---------------------------------------------------------------------
  DocVaultApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "docvault-api-${Env}"
      StageName: v1
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: "OFF"
          DataTraceEnabled: false
          MetricsEnabled: true
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt DocVaultUserPool.Arn
            Identity:
              Header: Authorization
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub "docvault-api-${Env}"
          version: '1.0'
        paths:
          /ping:
            get:
              summary: Unauthenticated infrastructure health probe
              security: []
              x-amazon-apigateway-auth:
                type: "NONE"
              responses:
                '200':
                  description: Service is reachable
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status": "ok"}'
          /upload:
            post:
              summary: Upload employee document
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadFunction.Arn}/invocations"
          /files:
            get:
              summary: List accessible files
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListFilesFunction.Arn}/invocations"
          /download/{doc_id}:
            get:
              summary: Download document by ID
              parameters:
                - name: doc_id
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DownloadFunction.Arn}/invocations"
          /files/{doc_id}:
            delete:
              summary: Delete document by ID
              parameters:
                - name: doc_id
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteFunction.Arn}/invocations"
            patch:
              summary: Update document tags
              parameters:
                - name: doc_id
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTagsFunction.Arn}/invocations"
          /files/{doc_id}/versions:
            get:
              summary: List document version history
              parameters:
                - name: doc_id
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VersionsFunction.Arn}/invocations"
          /activity:
            get:
              summary: Get security and document activity history
              security:
                - CognitoAuthorizer: []
              responses:
                default:
                  description: Default response
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ActivityFunction.Arn}/invocations"
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  # =====================================================================
  # PHASE 3 — Backend Handlers
  # =====================================================================

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.upload.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_TABLE_GSI: employee_id-index
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          KMS_KEY_ID: !Ref DocVaultKmsKey
      Policies:
        - Statement:
            - Sid: DocumentsMetadataWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn
            - Sid: AuditLogWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
            - Sid: DocumentsS3Upload
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${DocumentsBucket}/documents/*"
            - Sid: KmsEncrypt
              Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Encrypt
              Resource: !GetAtt DocVaultKmsKey.Arn
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /upload
            Method: post
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.files.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_TABLE_GSI: employee_id-index
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
      Policies:
        - Statement:
            - Sid: DocumentsMetadataQuery
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt DocumentsTable.Arn
                - !Sub "${DocumentsTable.Arn}/index/employee_id-index"
            - Sid: AuditLogWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
      Events:
        ListFilesApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /files
            Method: get
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.download.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_TABLE_GSI: employee_id-index
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - Statement:
            - Sid: DocumentsMetadataRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt DocumentsTable.Arn
            - Sid: AuditLogWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
            - Sid: DocumentsS3Download
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
              Resource: !Sub "arn:aws:s3:::${DocumentsBucket}/documents/*"
            - Sid: KmsDecrypt
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt DocVaultKmsKey.Arn
      Events:
        DownloadApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /download/{doc_id}
            Method: get
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  DeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.delete.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_TABLE_GSI: employee_id-index
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - Statement:
            - Sid: DocumentsMetadataDelete
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DocumentsTable.Arn
            - Sid: AuditLogWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
            - Sid: DocumentsS3Delete
              Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${DocumentsBucket}/documents/*"
      Events:
        DeleteApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /files/{doc_id}
            Method: delete
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  UpdateTagsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.tags.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_TABLE_GSI: employee_id-index
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
      Policies:
        - Statement:
            - Sid: DocumentsMetadataUpdate
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DocumentsTable.Arn
            - Sid: AuditLogWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
      Events:
        UpdateTagsApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /files/{doc_id}
            Method: patch
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  VersionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.versions.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          DOCUMENTS_TABLE_GSI: employee_id-index
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
      Policies:
        - Statement:
            - Sid: DocumentsMetadataRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt DocumentsTable.Arn
            - Sid: AuditLogWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
            - Sid: S3ListBucketVersions
              Effect: Allow
              Action:
                - s3:ListBucketVersions
              Resource: !Sub "arn:aws:s3:::${DocumentsBucket}"
      Events:
        VersionsApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /files/{doc_id}/versions
            Method: get
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  ActivityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: handlers.activity.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          EMPLOYEES_TABLE: !Ref EmployeesTable
          EMPLOYEES_TABLE_GSI: manager_id-index
      Policies:
        - Statement:
            - Sid: AuditLogRead
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource: !GetAtt AuditLogTable.Arn
            - Sid: EmployeesDirectReportsRead
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !GetAtt EmployeesTable.Arn
                - !Sub "${EmployeesTable.Arn}/index/manager_id-index"
      Events:
        ActivityApi:
          Type: Api
          Properties:
            RestApiId: !Ref DocVaultApi
            Path: /activity
            Method: get
      Tags:
        Project: employee-document-vault
        Environment: !Ref Env

  # =====================================================================
  # Observability & Monitoring: CloudWatch Alarms & Dashboard
  # =====================================================================

  DocVaultApiP95LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "docvault-apigw-p95-latency-${Env}"
      AlarmDescription: "Alerts when API Gateway p95 latency exceeds 1000ms for 2 consecutive 5-minute periods"
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub "docvault-api-${Env}"
        - Name: Stage
          Value: v1
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DocVaultLambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "docvault-lambda-error-rate-${Env}"
      AlarmDescription: "Alerts when aggregate Lambda error rate exceeds 5% for 2 consecutive 5-minute periods"
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5.0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: e1
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref UploadFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: e2
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListFilesFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: e3
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DownloadFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: e4
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DeleteFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: e5
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ActivityFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: i1
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref UploadFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: i2
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListFilesFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: i3
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DownloadFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: i4
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DeleteFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: i5
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ActivityFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: errors
          Expression: "FILL(e1,0) + FILL(e2,0) + FILL(e3,0) + FILL(e4,0) + FILL(e5,0)"
          ReturnData: false
        - Id: invocations
          Expression: "FILL(i1,0) + FILL(i2,0) + FILL(i3,0) + FILL(i4,0) + FILL(i5,0)"
          ReturnData: false
        - Id: error_rate
          Expression: "IF(invocations > 0, (errors / invocations) * 100, 0)"
          Label: "Aggregate Lambda Fleet Error Rate (%)"
          ReturnData: true

  DocVaultOverviewDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "docvault-overview-${Env}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Request Volume & Errors",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "Sum", "label": "Total Requests"}],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "Sum", "color": "#ff7f0e", "label": "4XX Errors"}],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "Sum", "color": "#d62728", "label": "5XX Errors"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Latency Percentiles (ms)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "Average", "label": "Average"}],
                  ["AWS/ApiGateway", "Latency", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "p90", "label": "p90"}],
                  ["AWS/ApiGateway", "Latency", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "p95", "color": "#e377c2", "label": "p95"}],
                  ["AWS/ApiGateway", "Latency", "ApiName", "docvault-api-${Env}", "Stage", "v1", {"stat": "p99", "color": "#d62728", "label": "p99"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Fleet Invocations",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${UploadFunction}", {"stat": "Sum", "label": "Upload"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ListFilesFunction}", {"stat": "Sum", "label": "ListFiles"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${DownloadFunction}", {"stat": "Sum", "label": "Download"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${DeleteFunction}", {"stat": "Sum", "label": "Delete"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${UpdateTagsFunction}", {"stat": "Sum", "label": "UpdateTags"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${VersionsFunction}", {"stat": "Sum", "label": "Versions"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ActivityFunction}", {"stat": "Sum", "label": "Activity"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Fleet Errors",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${UploadFunction}", {"stat": "Sum", "label": "Upload"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ListFilesFunction}", {"stat": "Sum", "label": "ListFiles"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${DownloadFunction}", {"stat": "Sum", "label": "Download"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${DeleteFunction}", {"stat": "Sum", "label": "Delete"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${UpdateTagsFunction}", {"stat": "Sum", "label": "UpdateTags"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${VersionsFunction}", {"stat": "Sum", "label": "Versions"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ActivityFunction}", {"stat": "Sum", "label": "Activity"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Execution Duration p95 (ms)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${UploadFunction}", {"stat": "p95", "label": "Upload p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${ListFilesFunction}", {"stat": "p95", "label": "ListFiles p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${DownloadFunction}", {"stat": "p95", "label": "Download p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${DeleteFunction}", {"stat": "p95", "label": "Delete p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${UpdateTagsFunction}", {"stat": "p95", "label": "UpdateTags p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${VersionsFunction}", {"stat": "p95", "label": "Versions p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${ActivityFunction}", {"stat": "p95", "label": "Activity p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Throttles",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Throttles", "FunctionName", "${UploadFunction}", {"stat": "Sum", "label": "Upload"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${ListFilesFunction}", {"stat": "Sum", "label": "ListFiles"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${DownloadFunction}", {"stat": "Sum", "label": "Download"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${DeleteFunction}", {"stat": "Sum", "label": "Delete"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${UpdateTagsFunction}", {"stat": "Sum", "label": "UpdateTags"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${VersionsFunction}", {"stat": "Sum", "label": "Versions"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${ActivityFunction}", {"stat": "Sum", "label": "Activity"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "DynamoDB Consumed Capacity Units",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "Documents-${Env}", {"stat": "Sum", "label": "Documents Read"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "Documents-${Env}", {"stat": "Sum", "label": "Documents Write"}],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "Employees-${Env}", {"stat": "Sum", "label": "Employees Read"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "Employees-${Env}", {"stat": "Sum", "label": "Employees Write"}],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "AuditLog-${Env}", {"stat": "Sum", "label": "AuditLog Read"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "AuditLog-${Env}", {"stat": "Sum", "label": "AuditLog Write"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 18,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "DynamoDB Throttles & S3 Activity",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "Documents-${Env}", {"stat": "Sum", "label": "Documents Read Throttles"}],
                  ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "Documents-${Env}", {"stat": "Sum", "label": "Documents Write Throttles"}],
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "AuditLog-${Env}", {"stat": "Sum", "label": "AuditLog Read Throttles"}],
                  ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "AuditLog-${Env}", {"stat": "Sum", "label": "AuditLog Write Throttles"}],
                  ["AWS/S3", "AllRequests", "BucketName", "${DocumentsBucket}", "FilterId", "EntireBucket", {"stat": "Sum", "label": "S3 All Requests", "yAxis": "right"}]
                ]
              }
            }
          ]
        }

Outputs:
  DocumentsBucketName:
    Description: S3 bucket holding employee documents
    Value: !Ref DocumentsBucket

  AccessLogsBucketName:
    Description: S3 bucket receiving S3 server access logs
    Value: !Ref AccessLogsBucket

  DocumentsTableName:
    Description: DynamoDB table for document metadata
    Value: !Ref DocumentsTable

  DocumentsTableGsiName:
    Description: GSI used for "list my files" / "list my team's files" queries
    Value: employee_id-index

  AuditLogTableName:
    Description: DynamoDB table for the append-only audit log
    Value: !Ref AuditLogTable

  KmsKeyId:
    Description: KMS key used for S3 default encryption
    Value: !Ref DocVaultKmsKey

  # --- Phase 2 Outputs ---

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref DocVaultUserPool

  UserPoolArn:
    Description: Cognito User Pool ARN (referenced by API Gateway authorizer)
    Value: !GetAtt DocVaultUserPool.Arn

  UserPoolClientId:
    Description: Cognito User Pool App Client ID (used by the frontend / CLI)
    Value: !Ref DocVaultUserPoolClient

  UserPoolDomain:
    Description: Cognito hosted-UI domain prefix
    Value: !Sub "docvault-${Env}"

  EmployeesTableName:
    Description: DynamoDB table storing employee identity and manager relationships
    Value: !Ref EmployeesTable

  EmployeesTableManagerGsiName:
    Description: GSI on Employees table used to list direct reports of a manager
    Value: manager_id-index

  ApiGatewayId:
    Description: API Gateway REST API ID
    Value: !Ref DocVaultApi

  ApiGatewayEndpoint:
    Description: Base URL of the API Gateway stage
    Value: !Sub "https://${DocVaultApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
